<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --surface: #ffffff;
        --surface-muted: #f8fafc;
        --surface-accent: #eef4ff;
        --border-default: #e5e7eb;
        --border-subtle: #f1f5f9;
        --text-primary: #111827;
        --text-secondary: #64748b;
        --accent: #2563eb;
        --accent-strong: #1d4ed8;
        --accent-soft: #dbeafe;
        --skeleton: #eef2f7;
        --skeleton-shine: rgba(255, 255, 255, 0.78);
        --shadow-card: 0 18px 45px rgba(15, 23, 42, 0.08);
        --shadow-avatar: 0 12px 28px rgba(15, 23, 42, 0.08);
        --radius-card: 24px;
        --radius-panel: 18px;
        --text-heading: clamp(28px, 7vw, 40px);
        --text-body: 15px;
        --text-small: 13px;
        --text-caption: 12px;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --surface: #111827;
        --surface-muted: #0f172a;
        --surface-accent: rgba(37, 99, 235, 0.18);
        --border-default: rgba(148, 163, 184, 0.28);
        --border-subtle: rgba(148, 163, 184, 0.18);
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --accent: #2563eb;
        --accent-strong: #bfdbfe;
        --accent-soft: rgba(59, 130, 246, 0.18);
        --skeleton: rgba(148, 163, 184, 0.18);
        --skeleton-shine: rgba(255, 255, 255, 0.16);
        --shadow-card: 0 20px 55px rgba(2, 6, 23, 0.34);
        --shadow-avatar: 0 14px 34px rgba(2, 6, 23, 0.36);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          color-scheme: dark;
          --surface: #111827;
          --surface-muted: #0f172a;
          --surface-accent: rgba(37, 99, 235, 0.18);
          --border-default: rgba(148, 163, 184, 0.28);
          --border-subtle: rgba(148, 163, 184, 0.18);
          --text-primary: #f8fafc;
          --text-secondary: #cbd5e1;
          --accent: #2563eb;
          --accent-strong: #bfdbfe;
          --accent-soft: rgba(59, 130, 246, 0.18);
          --skeleton: rgba(148, 163, 184, 0.18);
          --skeleton-shine: rgba(255, 255, 255, 0.16);
          --shadow-card: 0 20px 55px rgba(2, 6, 23, 0.34);
          --shadow-avatar: 0 14px 34px rgba(2, 6, 23, 0.36);
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 18px;
        background: transparent;
        color: var(--text-primary);
        font-size: var(--text-body);
        line-height: 1.5;
      }

      .card {
        position: relative;
        overflow: hidden;
        width: 100%;
        max-width: 640px;
        margin: 0 auto;
        border: 1px solid var(--border-default);
        border-radius: var(--radius-card);
        background: var(--surface);
        color: var(--text-primary);
        box-shadow: var(--shadow-card);
      }

      .hero {
        position: relative;
        display: flex;
        gap: 18px;
        align-items: flex-end;
        padding: 24px;
        min-height: 156px;
        background: var(--surface-muted);
      }

      .hero::after {
        position: absolute;
        inset: auto 0 0;
        height: 1px;
        content: "";
        background: var(--border-default);
      }

      .avatar {
        width: 116px;
        height: 136px;
        flex: 0 0 auto;
        border: 1px solid var(--border-default);
        border-radius: 22px;
        object-fit: cover;
        object-position: top center;
        background: var(--surface-muted);
        box-shadow: var(--shadow-avatar);
      }

      .avatarFallback {
        display: grid;
        place-items: center;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        border: 1px solid var(--border-default);
        border-radius: 999px;
        padding: 6px 10px;
        background: color-mix(in srgb, var(--surface) 84%, transparent);
        color: var(--text-secondary);
        font-size: var(--text-caption);
        font-weight: 750;
      }

      .name {
        margin: 0 0 6px;
        font-size: var(--text-heading);
        line-height: 1.15;
        letter-spacing: -0.04em;
      }

      .subtitle {
        margin: 0;
        color: var(--text-secondary);
        font-size: var(--text-body);
        line-height: 1.45;
      }

      .content {
        display: grid;
        gap: 14px;
        padding: 20px 24px 24px;
      }

      .field {
        display: grid;
        gap: 4px;
        border: 1px solid var(--border-default);
        border-radius: var(--radius-panel);
        padding: 13px 14px;
        background: var(--surface);
      }

      .field:last-child {
        border-bottom: 1px solid var(--border-default);
      }

      .label {
        color: var(--text-secondary);
        font-size: var(--text-caption);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .value {
        margin: 0;
        font-size: var(--text-body);
        line-height: 1.55;
        white-space: pre-line;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }

      .chip {
        border: 1px solid var(--accent-soft);
        border-radius: 999px;
        padding: 7px 11px;
        background: var(--surface-accent);
        color: var(--accent-strong);
        font-size: var(--text-small);
        font-weight: 750;
      }

      .empty {
        padding: 18px;
        border: 1px dashed var(--border-default);
        border-radius: var(--radius-panel);
        color: var(--text-secondary);
        background: var(--surface);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .wide {
        grid-column: 1 / -1;
      }

      .loading .hero {
        align-items: center;
      }

      .skeleton {
        position: relative;
        overflow: hidden;
        border-radius: 999px;
        background: var(--skeleton);
      }

      .skeleton::after {
        position: absolute;
        inset: 0;
        content: "";
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, var(--skeleton-shine), transparent);
        animation: shimmer 1.35s ease-in-out infinite;
      }

      .skeletonAvatar {
        width: 116px;
        height: 136px;
        flex: 0 0 auto;
        border-radius: 26px;
      }

      .skeletonPill {
        width: 132px;
        height: 27px;
        margin-bottom: 12px;
      }

      .skeletonName {
        width: min(280px, 54vw);
        height: 46px;
        margin-bottom: 10px;
      }

      .skeletonSubtitle {
        width: 148px;
        height: 18px;
      }

      .skeletonChip {
        width: 72px;
        height: 30px;
      }

      .skeletonField {
        gap: 12px;
      }

      .skeletonLabel {
        width: 72px;
        height: 13px;
      }

      .skeletonValue {
        width: 72%;
        height: 18px;
      }

      .skeletonValueShort {
        width: 46%;
      }

      .source {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid var(--border-subtle);
        padding-top: 14px;
        color: var(--text-secondary);
        font-size: var(--text-caption);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .button {
        appearance: none;
        border: 1px solid var(--border-default);
        border-radius: 999px;
        padding: 8px 12px;
        background: var(--surface);
        color: var(--text-primary);
        cursor: pointer;
        font: inherit;
        font-size: var(--text-small);
        font-weight: 700;
      }

      .buttonPrimary {
        border-color: var(--accent);
        background: var(--accent);
        color: #ffffff;
      }

      .button:focus-visible {
        outline: 3px solid var(--accent-soft);
        outline-offset: 2px;
      }

      @keyframes shimmer {
        100% {
          transform: translateX(100%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .skeleton::after {
          animation: none;
        }
      }

      @media (max-width: 560px) {
        body {
          padding: 12px;
        }

        .hero {
          align-items: center;
          gap: 14px;
          padding: 18px;
        }

        .avatar {
          width: 92px;
          height: 112px;
          border-radius: 22px;
        }

        .skeletonAvatar {
          width: 92px;
          height: 112px;
          border-radius: 22px;
        }

        .content {
          padding: 16px 18px 18px;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .source {
          align-items: stretch;
          flex-direction: column;
        }

        .button {
          flex: 1 1 0;
        }
      }
    </style>
  </head>
  <body>
    <main id="root" class="card loading">
      <section class="hero">
        <div class="skeleton skeletonAvatar"></div>
        <div>
          <div class="skeleton skeletonPill"></div>
          <div class="skeleton skeletonName"></div>
          <div class="skeleton skeletonSubtitle"></div>
          <div class="chips">
            <div class="skeleton skeletonChip"></div>
            <div class="skeleton skeletonChip"></div>
            <div class="skeleton skeletonChip"></div>
          </div>
        </div>
      </section>
      <section class="content">
        <div class="grid">
          <section class="field skeletonField">
            <div class="skeleton skeletonLabel"></div>
            <div class="skeleton skeletonValue skeletonValueShort"></div>
          </section>
          <section class="field skeletonField">
            <div class="skeleton skeletonLabel"></div>
            <div class="skeleton skeletonValue"></div>
          </section>
          <section class="field skeletonField">
            <div class="skeleton skeletonLabel"></div>
            <div class="skeleton skeletonValue"></div>
          </section>
          <section class="field skeletonField">
            <div class="skeleton skeletonLabel"></div>
            <div class="skeleton skeletonValue"></div>
          </section>
          <section class="field wide skeletonField">
            <div class="skeleton skeletonLabel"></div>
            <div class="skeleton skeletonValue"></div>
            <div class="skeleton skeletonValue skeletonValueShort"></div>
          </section>
          <section class="field wide skeletonField">
            <div class="skeleton skeletonLabel"></div>
            <div class="skeleton skeletonValue"></div>
            <div class="skeleton skeletonValue"></div>
          </section>
        </div>
      </section>
    </main>

    <script>
      const pendingRequests = new Map();
      let nextRequestId = 1;

      function applyTheme(theme) {
        const value = typeof theme === "string" ? theme : theme?.mode || theme?.name;
        if (value === "dark" || value === "light") {
          document.documentElement.dataset.theme = value;
          return;
        }

        document.documentElement.removeAttribute("data-theme");
      }

      function rpcRequest(method, params) {
        if (!window.parent || window.parent === window) {
          return Promise.reject(new Error("Apps bridge parent window is unavailable"));
        }

        const id = nextRequestId++;

        return new Promise((resolve, reject) => {
          const timeout = window.setTimeout(() => {
            pendingRequests.delete(id);
            reject(new Error(`Apps bridge request timed out: ${method}`));
          }, 6000);

          pendingRequests.set(id, { resolve, reject, timeout });
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        });
      }

      async function callTool(name, args) {
        try {
          return await rpcRequest("tools/call", {
            name,
            arguments: args,
          });
        } catch (error) {
          if (typeof window.openai?.callTool !== "function") throw error;
          return window.openai.callTool(name, args);
        }
      }

      function sendFollowUpMessage(text) {
        window.parent?.postMessage(
          {
            jsonrpc: "2.0",
            method: "ui/message",
            params: {
              role: "user",
              content: [{ type: "text", text }],
            },
          },
          "*",
        );
      }

      function splitItems(value) {
        return String(value || "")
          .split(/[;；\n]/)
          .map((item) => item.trim())
          .filter(Boolean);
      }

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        }[char]));
      }

      function field(label, value) {
        if (!value) return "";
        return `
          <section class="field">
            <div class="label">${escapeHtml(label)}</div>
            <p class="value">${escapeHtml(value)}</p>
          </section>
        `;
      }

      function normalizeOutput(payload) {
        const value = payload || {};

        if (value.legislator) {
          return value;
        }

        if (value.structuredContent?.legislator) {
          return value.structuredContent;
        }

        if (value.toolOutput?.legislator) {
          return value.toolOutput;
        }

        if (value.toolOutput?.structuredContent?.legislator) {
          return value.toolOutput.structuredContent;
        }

        if (value.result?.structuredContent?.legislator) {
          return value.result.structuredContent;
        }

        if (value.result?.legislator) {
          return value.result;
        }

        return value.structuredContent || value.toolOutput || value;
      }

      function renderFromOutput(payload) {
        const output = normalizeOutput(payload);
        const legislator = output.legislator;
        const root = document.getElementById("root");

        if (!legislator || output.found === false) {
          return false;
        }

        const committees = splitItems(legislator.committee).slice(-3);
        const phones = splitItems(legislator.tel).slice(0, 3).join("\n");
        const degree = splitItems(legislator.degree).slice(0, 3).join("\n");
        const experience = splitItems(legislator.experience).slice(0, 4).join("\n");
        const photo = legislator.imageUrl || "";
        const initials = String(legislator.name || "?").slice(0, 2);

        root.className = "card";
        root.innerHTML = `
          <section class="hero">
            ${
              photo
                ? `<img class="avatar" src="${escapeHtml(photo)}" alt="${escapeHtml(legislator.name)}照片" />`
                : `<div class="avatar avatarFallback">${escapeHtml(initials)}</div>`
            }
            <div>
              <div class="eyebrow">立法院委員資料卡</div>
              <h1 class="name">${escapeHtml(legislator.name)}</h1>
              <p class="subtitle">${escapeHtml(legislator.ename || "")}</p>
              <div class="chips">
                <span class="chip">${escapeHtml(legislator.party || "政黨未提供")}</span>
                <span class="chip">${escapeHtml(legislator.areaName || "選區未提供")}</span>
                <span class="chip">第 ${escapeHtml(legislator.term || "")} 屆</span>
              </div>
            </div>
          </section>
          <section class="content">
            <div class="grid">
              ${field("就任日期", legislator.onboardDate)}
              ${field("聯絡電話", phones)}
              ${field("近期委員會", committees.join("\n"))}
              ${field("服務處地址", legislator.addr)}
              <div class="wide">${field("學歷", degree)}</div>
              <div class="wide">${field("經歷摘要", experience)}</div>
            </div>
            <footer class="source">
              <span>資料來源：立法院開放資料</span>
              <div class="actions" aria-label="資料卡操作">
                <button class="button" type="button" data-action="refresh">重新整理</button>
                <button class="button buttonPrimary" type="button" data-action="ask">詢問重點</button>
              </div>
            </footer>
          </section>
        `;
        bindActions(legislator);
        return true;
      }

      function bindActions(legislator) {
        document.querySelector('[data-action="refresh"]')?.addEventListener("click", async () => {
          await hydrateWithToolCall(legislator.name);
        });

        document.querySelector('[data-action="ask"]')?.addEventListener("click", () => {
          sendFollowUpMessage(`請整理 ${legislator.name} 委員的政黨、選區、近期委員會與主要經歷重點。`);
        });
      }

      function getToolInputName(payload) {
        return (
          payload?.toolInput?.name ||
          payload?.input?.name ||
          window.openai?.toolInput?.name ||
          "黃國昌"
        );
      }

      function renderEmpty(message) {
        const root = document.getElementById("root");
        root.className = "empty";
        root.textContent = message || "找不到可顯示的立委資料。";
      }

      async function hydrateWithToolCall(name) {
        try {
          const result = await callTool("get_legislator_profile_data", { name });
          return renderFromOutput(result);
        } catch (error) {
          console.error("Unable to hydrate legislator card", error);
          return false;
        }
      }

      async function render(payload = {}) {
        applyTheme(payload.theme || window.openai?.theme);

        const bootPayload = {
          toolOutput: window.openai?.toolOutput,
          toolResponseMetadata: window.openai?.toolResponseMetadata,
          toolInput: window.openai?.toolInput,
          ...payload,
        };

        if (renderFromOutput(bootPayload)) return;

        const name = getToolInputName(bootPayload);
        if (await hydrateWithToolCall(name)) return;

        renderEmpty(`找不到 ${name} 的可顯示委員資料。`);
      }

      render();
      window.addEventListener("openai:set_globals", (event) => {
        render(event.detail?.globals || event.detail || {});
      });

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;

        if (Object.prototype.hasOwnProperty.call(message, "id") && pendingRequests.has(message.id)) {
          const request = pendingRequests.get(message.id);
          window.clearTimeout(request.timeout);
          pendingRequests.delete(message.id);

          if (message.error) {
            request.reject(new Error(message.error.message || "Apps bridge request failed"));
          } else {
            request.resolve(message.result);
          }
          return;
        }

        if (message.method === "ui/notifications/tool-input") {
          render({ toolInput: message.params || {} });
          return;
        }

        if (message.method !== "ui/notifications/tool-result") return;

        const result = message.params || {};
        render(result);
      });
    </script>
  </body>
</html>
